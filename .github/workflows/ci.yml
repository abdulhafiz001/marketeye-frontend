name: Frontend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm is the only lockfile
        run: test -f pnpm-lock.yaml && test ! -f package-lock.json && test ! -f yarn.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo Doctor
        run: pnpm doctor

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
